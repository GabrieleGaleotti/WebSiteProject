<a class="card-opera" [routerLink]="['/gallery', artwork().id]">
  <div class="cornice">
    <img [src]="artwork().image" [alt]="artwork().title" draggable="false" />
  </div>
  <p class="targhetta">
    <span class="titolo">{{ artwork().title }}</span>
    <span class="anno">{{ artwork().year }}</span>
  </p>
</a>
