@if (artwork(); as a) {
  <section class="scena">
    <img [src]="a.image" [alt]="a.title" class="opera" />

    <div class="didascalia">
      <h1>{{ a.title }}</h1>
      <p class="dati">
        {{ a.technique }}<br />
        {{ a.dimensions }}<br />
        {{ a.year }}
      </p>
      @if (a.description) {
        <p class="testo">{{ a.description }}</p>
      }
    </div>
  </section>
} @else {
  <p class="pagina container">Quadro non trovato.</p>
}
