@if (artwork(); as a) {
  <section class="scena"
   (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
    (pointermove)="onPointerMove($event)">
    <img [src]="a.image" [alt]="a.title" class="opera" draggable="false" />

    <div class="didascalia">
      <h1>{{ a.title }}</h1>
      <p class="dati">
        {{ a.technique }}<br />
        {{ a.dimensions }}<br />
        {{ a.year }}
      </p>
      @if (a.description) {
        <p class="testo">{{ a.description }}</p>
      }
    </div>

    <button type="button" class="freccia freccia-sx" (click)="indietro()" aria-label="Quadro precedente">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <button type="button" class="freccia freccia-dx" (click)="avanti()" aria-label="Quadro successivo">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div class="contatore" aria-live="polite">{{ position() }} / {{ total }}</div>
  </section>
} @else {
  <p class="pagina container">Quadro non trovato.</p>
}
